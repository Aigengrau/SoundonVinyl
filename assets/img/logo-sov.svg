<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ЗВУК НА ВИНИЛЕ — направление «Винил» экосистемы ФУНДАМЕНТ">
  <title>ЗВУК НА ВИНИЛЕ</title>
  <!-- Родственник знака ФУНДАМЕНТ: белый квадрат в рамке, геометрическая фигура внутри.
       Стороны рамки — древесный #7A4A21, цвет винилового направления экосистемы.
       В центре вместо буквы Ф — пластинка: две окружности и шпиндель. -->
  <rect width="120" height="120" fill="#FFFFFF"/>
  <polygon points="0,0 120,0 110,10 10,10" fill="#7A4A21"/>
  <polygon points="120,0 120,120 110,110 110,10" fill="#7A4A21"/>
  <polygon points="120,120 0,120 10,110 110,110" fill="#7A4A21"/>
  <polygon points="0,120 0,0 10,10 10,110" fill="#7A4A21"/>
  <g fill="none" stroke="#0B0B0B" stroke-width="4.5">
    <circle cx="60" cy="60" r="34"/>
    <circle cx="60" cy="60" r="15"/>
  </g>
  <circle cx="60" cy="60" r="4.5" fill="#0B0B0B"/>
</svg>
